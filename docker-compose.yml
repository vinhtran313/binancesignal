services:
  postgres:
    image: postgres:16-alpine
    container_name: futures_terminal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: traderpass
      POSTGRES_DB: trading_terminal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading_terminal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
